name: gharkilist
description: "gharkilist: Smart Household Inventory Tracker for Indian Families."
publish_to: "none"

version: 0.0.6

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter

  shadcn_ui: ^0.56.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  file_picker: ^8.1.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    - assets/svg/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/adaptive_android_logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/adaptive_android_logo.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_android_monochrome_logo.png"
  remove_alpha_ios: true
